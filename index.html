<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatmanHub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Oswald',sans-serif;
background:
linear-gradient(rgba(0,0,0,0.86),rgba(0,0,0,0.95)),
url('https://wallpapercave.com/wp/wp3649653.jpg');
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#d9a30022 0%,transparent 40%);
pointer-events:none;
}

header{
padding:40px 20px;
text-align:center;
border-bottom:1px solid #d9a30033;
backdrop-filter:blur(10px);
}

header h1{
font-size:70px;
letter-spacing:10px;
color:#d9a300;
text-shadow:0 0 25px #d9a300;
}

header p{
margin-top:10px;
color:#888;
letter-spacing:4px;
}

main{
padding:50px;
}

#hub{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
}

.app-card{
height:260px;
border-radius:25px;
position:relative;
overflow:hidden;
cursor:pointer;
transition:0.4s;
background:#111;
border:1px solid #333;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}

.app-card:hover{
transform:translateY(-10px) scale(1.02);
border-color:#d9a300;
box-shadow:0 0 35px #d9a30055;
}

.app-card img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0.35;
transition:0.4s;
}

.app-card:hover img{
transform:scale(1.08);
opacity:0.5;
}

.app-overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,#000 15%,transparent);
}

.app-title{
position:absolute;
bottom:30px;
left:30px;
font-size:40px;
letter-spacing:4px;
color:#fff;
text-shadow:0 0 20px black;
}

.section{
display:none;
animation:fade 0.5s ease;
}

.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.back-btn{
margin-bottom:25px;
padding:12px 25px;
background:#111;
border:1px solid #d9a300;
color:#d9a300;
cursor:pointer;
border-radius:12px;
font-family:'Oswald';
letter-spacing:2px;
transition:0.3s;
}

.back-btn:hover{
background:#d9a300;
color:black;
}

.counter-box{
background:#111111dd;
padding:40px;
border-radius:25px;
border:1px solid #333;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.8);
}

#counter{
font-size:120px;
color:#d9a300;
text-shadow:0 0 30px #d9a300;
transition:0.2s;
margin:25px 0;
}

.counter-quote{
font-size:24px;
letter-spacing:2px;
margin-top:15px;
color:#aaa;
height:40px;
}

.controls{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:30px;
}

.controls input{
width:120px;
padding:12px;
background:#000;
border:1px solid #444;
color:white;
border-radius:10px;
font-size:18px;
text-align:center;
}

.controls button{
padding:14px 24px;
font-size:18px;
background:#1b1b1b;
border:none;
color:#d9a300;
border-radius:12px;
cursor:pointer;
transition:0.3s;
font-family:'Oswald';
}

.controls button:hover{
background:#d9a300;
color:black;
transform:scale(1.05);
}

.vote-create{
background:#111111dd;
padding:30px;
border-radius:20px;
margin-bottom:35px;
border:1px solid #333;
}

.vote-create input{
width:100%;
padding:15px;
margin-bottom:15px;
background:black;
border:1px solid #444;
color:white;
border-radius:10px;
font-size:16px;
}

.vote-create button{
padding:14px 24px;
background:#d9a300;
border:none;
color:black;
font-family:'Oswald';
border-radius:10px;
cursor:pointer;
font-size:18px;
}

.vote-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
}

.vote-card{
background:#111111dd;
padding:25px;
border-radius:20px;
border:1px solid #333;
cursor:pointer;
transition:0.3s;
position:relative;
overflow:hidden;
}

.vote-card:hover{
transform:translateY(-6px);
border-color:#d9a300;
}

.vote-card h3{
font-size:28px;
color:#d9a300;
letter-spacing:2px;
}

.vote-detail{
margin-top:20px;
display:none;
animation:fade 0.4s ease;
}

.vote-option{
margin-top:12px;
padding:14px;
background:#1a1a1a;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.vote-option button{
background:#d9a300;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
font-family:'Oswald';
}

.delete-btn{
margin-top:18px;
width:100%;
padding:12px;
background:#7a0000;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
font-family:'Oswald';
}

.open .vote-detail{
display:block;
}

@media(max-width:700px){

header h1{
font-size:45px;
}

#counter{
font-size:80px;
}

.app-title{
font-size:28px;
}

main{
padding:20px;
}

}
</style>
</head>

<body>

<header>
<h1>BATMANHUB</h1>
<p>WAYNE ENTERPRISES SYSTEM</p>
</header>

<main>

<div id="hub">

<div class="app-card" onclick="openSection('contadorSection')">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop">
<div class="app-overlay"></div>
<div class="app-title">CONTADOR</div>
</div>

<div class="app-card" onclick="openSection('votacionesSection')">
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=2070&auto=format&fit=crop">
<div class="app-overlay"></div>
<div class="app-title">VOTACIONES</div>
</div>

</div>

<section id="contadorSection" class="section">

<button class="back-btn" onclick="goHub()">← BATMANHUB</button>

<div class="counter-box">

<h2>CONTADOR</h2>

<div id="counter">0</div>

<div class="counter-quote" id="quote"></div>

<div class="controls">
<button onclick="changeCounter(-1)">-1</button>
<button onclick="changeCounter(1)">+1</button>

<input type="number" id="customValue" placeholder="Número">

<button onclick="addCustom()">SUMAR</button>
<button onclick="subtractCustom()">RESTAR</button>
</div>

</div>

</section>

<section id="votacionesSection" class="section">

<button class="back-btn" onclick="goHub()">← BATMANHUB</button>

<div class="vote-create">

<input type="text" id="voteTitle" placeholder="Título">

<input type="text" id="option1" placeholder="Opción 1">

<input type="text" id="option2" placeholder="Opción 2">

<button onclick="createVote()">CREAR</button>

</div>

<div class="vote-grid" id="voteGrid"></div>

</section>

</main>

<audio id="sound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3">
</audio>

<script>

let counter = localStorage.getItem("batCounter")
? parseInt(localStorage.getItem("batCounter"))
: 0

const quotes = [
"WHY DO WE FALL?",
"THE NIGHT IS DARKEST BEFORE THE DAWN",
"I'M BATMAN",
"A HERO CAN BE ANYONE",
"YOU EITHER DIE A HERO...",
"THIS CITY NEEDS ME",
"FEAR IS A TOOL",
"THE BAT SIGNAL IS NOT JUST A CALL",
"RISE",
"THE SHADOW BETRAYS YOU"
]

document.getElementById("counter").innerText = counter
updateQuote()

function playSound(){
document.getElementById("sound").currentTime=0
document.getElementById("sound").play()
}

function animateCounter(){
const c = document.getElementById("counter")
c.style.transform="scale(1.2)"
setTimeout(()=>{
c.style.transform="scale(1)"
},150)
}

function updateQuote(){
document.getElementById("quote").innerText =
quotes[Math.floor(Math.random()*quotes.length)]
}

function changeCounter(value){
counter += value

document.getElementById("counter").innerText = counter

localStorage.setItem("batCounter",counter)

animateCounter()
playSound()
updateQuote()
}

function addCustom(){
const val = parseInt(document.getElementById("customValue").value)

if(!isNaN(val)){
changeCounter(val)
}
}

function subtractCustom(){
const val = parseInt(document.getElementById("customValue").value)

if(!isNaN(val)){
changeCounter(-val)
}
}

function openSection(id){

document.getElementById("hub").style.display="none"

document.querySelectorAll(".section").forEach(sec=>{
sec.classList.remove("active")
})

document.getElementById(id).classList.add("active")
}

function goHub(){

document.getElementById("hub").style.display="grid"

document.querySelectorAll(".section").forEach(sec=>{
sec.classList.remove("active")
})
}

let votes = JSON.parse(localStorage.getItem("batVotes")) || []

function saveVotes(){
localStorage.setItem("batVotes",JSON.stringify(votes))
}

function createVote(){

const title = document.getElementById("voteTitle").value
const option1 = document.getElementById("option1").value
const option2 = document.getElementById("option2").value

if(title && option1 && option2){

votes.push({
id:Date.now(),
title:title,
creator:"user",
options:[
{text:option1,votes:0,voters:[]},
{text:option2,votes:0,voters:[]}
]
})

saveVotes()
renderVotes()

document.getElementById("voteTitle").value=""
document.getElementById("option1").value=""
document.getElementById("option2").value=""
}
}

function vote(voteId,optionIndex){

const userId = "user"

const voteObj = votes.find(v=>v.id===voteId)

if(voteObj.options[optionIndex].voters.includes(userId)){
return
}

voteObj.options[optionIndex].votes++
voteObj.options[optionIndex].voters.push(userId)

saveVotes()
renderVotes()
}

function deleteVote(id){

votes = votes.filter(v=>v.id!==id)

saveVotes()
renderVotes()
}

function toggleVote(card){
card.classList.toggle("open")
}

function renderVotes(){

const grid = document.getElementById("voteGrid")

grid.innerHTML=""

votes.forEach(vote=>{

const card = document.createElement("div")
card.className="vote-card"

card.innerHTML=`

<h3>${vote.title}</h3>

<div class="vote-detail">

${vote.options.map((opt,index)=>`

<div class="vote-option">

<span>${opt.text} (${opt.votes})</span>

<button onclick="event.stopPropagation();vote(${vote.id},${index})">
VOTAR
</button>

</div>

`).join("")}

<button class="delete-btn"
onclick="event.stopPropagation();deleteVote(${vote.id})">
BORRAR
</button>

</div>

`

card.onclick=()=>toggleVote(card)

grid.appendChild(card)

})
}

renderVotes()

</script>

</body>
</html>
