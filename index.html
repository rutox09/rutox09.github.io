<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatmanHub</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
background-image:
linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.92)),
url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop");
background-size:cover;
background-position:center;
background-attachment:fixed;
position:relative;
}

/* SCANLINES */

body::before{
content:"";
position:fixed;
inset:0;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.02),
rgba(255,255,255,.02) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
z-index:999;
}

/* LLUVIA */

.rain{
position:fixed;
inset:0;
overflow:hidden;
z-index:-1;
}

.drop{
position:absolute;
width:1px;
height:120px;
background:linear-gradient(transparent,#8fbfff);
opacity:.18;
animation:rain linear infinite;
}

@keyframes rain{
0%{
transform:translateY(-150px);
}
100%{
transform:translateY(120vh);
}
}

/* PARTÍCULAS */

.particles span{
position:fixed;
width:3px;
height:3px;
background:#ffd000;
border-radius:50%;
opacity:.3;
animation:float 12s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) translateX(0);
}
100%{
transform:translateY(-100vh) translateX(100px);
}
}

/* PANTALLA LOGIN */

#boot{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:5000;
animation:bootfade 5s forwards;
}

#boot h1{
font-size:4rem;
color:#ffd000;
letter-spacing:10px;
text-shadow:0 0 30px #ffd000;
animation:pulse 2s infinite;
}

#boot p{
margin-top:20px;
opacity:.8;
}

@keyframes bootfade{
0%,80%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.04);
}
}

/* NAV */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,208,0,.2);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:2rem;
font-weight:700;
color:#ffd000;
letter-spacing:3px;
text-shadow:0 0 20px #ffd000;
}

.modeBtn{
background:linear-gradient(145deg,#1a1a1a,#333);
border:none;
padding:12px 20px;
color:#ffd000;
cursor:pointer;
border-radius:10px;
transition:.3s;
box-shadow:
0 0 15px rgba(255,208,0,.15),
inset 0 0 10px rgba(255,255,255,.05);
}

.modeBtn:hover{
transform:translateY(-3px);
}

/* HUB */

.hub{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:40px;
padding:70px;
max-width:1600px;
margin:auto;
}

.card{
height:260px;
display:flex;
justify-content:center;
align-items:center;
position:relative;
background:
linear-gradient(
145deg,
rgba(20,20,20,.95),
rgba(5,5,5,.92)
);
border:1px solid rgba(255,208,0,.15);
overflow:hidden;
}

.card::after{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(
circle at top,
rgba(0,170,255,.12),
transparent 70%
);
pointer-events:none;
}

.card h2{
font-size:2.3rem;
letter-spacing:4px;
z-index:2;
}

/* SECCIONES */

.section{
display:none;
padding:40px;
animation:fade .5s;
}

.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* CONTADOR */

.counterBox{
max-width:700px;
margin:auto;
padding:40px;
background:rgba(0,0,0,.65);
border-radius:25px;
border:1px solid rgba(255,208,0,.2);
backdrop-filter:blur(12px);
box-shadow:0 0 40px rgba(255,208,0,.1);
}

.counterDisplay{
font-size:7rem;
text-align:center;
margin:30px 0;
color:#00e5ff;
text-shadow:
0 0 20px #00e5ff,
0 0 50px #00e5ff;
animation:led 1s infinite alternate;
}

@keyframes led{
from{
opacity:.7;
}
to{
opacity:1;
}
}

.quote{
text-align:center;
font-size:1rem;
opacity:.8;
margin-bottom:30px;
min-height:30px;
}

.controls{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:14px 24px;
border:none;
border-radius:12px;
background:linear-gradient(145deg,#202020,#101010);
color:#ffd000;
cursor:pointer;
font-size:1rem;
transition:.25s;
box-shadow:
0 0 20px rgba(255,208,0,.12),
inset 0 0 10px rgba(255,255,255,.05);
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 0 25px rgba(255,208,0,.3);
}

input{
padding:12px;
border:none;
border-radius:10px;
background:#111;
color:white;
width:120px;
text-align:center;
}

/* VOTACIONES */

.voteGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:30px;
}

.voteCard{
background:rgba(10,10,10,.75);
border:1px solid rgba(255,208,0,.15);
padding:30px;
border-radius:20px;
cursor:pointer;
transition:.35s;
position:relative;
overflow:hidden;
}

.voteCard:hover{
transform:scale(1.04);
box-shadow:0 0 35px rgba(255,208,0,.25);
}

.voteCard h3{
color:#ffd000;
font-size:1.3rem;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
backdrop-filter:blur(10px);
animation:fade .4s;
}

.modalContent{
width:90%;
max-width:600px;
background:#0d0d0d;
padding:40px;
border-radius:25px;
border:1px solid rgba(255,208,0,.25);
box-shadow:
0 0 50px rgba(255,208,0,.2);
position:relative;
animation:zoom .35s;
}

@keyframes zoom{
from{
transform:scale(.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.option{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
margin:12px 0;
background:#151515;
border-radius:12px;
}

/* CHAT */

.chatBox{
height:250px;
overflow:auto;
background:#101010;
padding:15px;
border-radius:15px;
margin-top:20px;
}

.message{
margin:8px 0;
}

/* MAPA */

.map{
margin-top:20px;
height:250px;
border-radius:20px;
background:
linear-gradient(45deg,#0d0d0d,#1c1c1c);
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
color:#ffd000;
}

/* MODO BRUCE */

.bruce{
background:#f5f5f5;
color:black;
}

.bruce .card,
.bruce .counterBox,
.bruce .voteCard{
background:white;
color:black;
}

.bruce button{
background:#ddd;
color:black;
}

</style>
</head>

<body>

<div id="boot">
<h1>WAYNE ENTERPRISES</h1>
<p>ACCESSING BATCAVE SYSTEM...</p>
</div>

<div class="rain" id="rain"></div>

<div class="particles" id="particles"></div>

<nav>
<div class="logo">BATMANHUB</div>
</nav>

<div class="hub" id="hub">

<div class="card" onclick="openSection('counter')">
<h2>CONTADOR</h2>
</div>

<div class="card" onclick="openSection('votes')">
<h2>VOTACIONES</h2>
</div>

<div class="card" onclick="openSection('missions')">
<h2>MISIONES</h2>
</div>

<div class="card" onclick="openSection('stats')">
<h2>ESTADÍSTICAS</h2>
</div>

</div>

<!-- CONTADOR -->

<section class="section" id="counter">

<div class="counterBox">

<h1 style="text-align:center;color:#ffd000;">CONTADOR</h1>

<div class="counterDisplay" id="count">0</div>

<div class="quote" id="quote"></div>

<div class="controls">

<button onclick="change(-1)">-1</button>

<button onclick="change(1)">+1</button>

<input type="number" id="customNum" placeholder="número">

<button onclick="customAdd()">Añadir</button>

<button onclick="customSub()">Restar</button>

</div>

</div>

</section>

<!-- VOTACIONES -->

<section class="section" id="votes">

<div style="max-width:800px;margin:auto;">

<h1 style="text-align:center;color:#ffd000;">VOTACIONES</h1>

<div style="display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center;">

<input id="voteTitle" placeholder="Título">

<input id="option1" placeholder="Opción 1">

<input id="option2" placeholder="Opción 2">

<button onclick="createVote()">Crear</button>

</div>

<div class="voteGrid" id="voteGrid"></div>

</div>

</section>

<!-- MODAL -->

<div class="modal" id="voteModal">

<div class="modalContent">

<h2 id="modalTitle"></h2>

<div id="modalOptions"></div>

<button onclick="closeModal()">Cerrar</button>

</div>

</div>

<!-- NOTAS -->

<section class="section" id="notes">

<div class="counterBox">

<h1 style="text-align:center;color:#ffd000;">NOTAS</h1>

<textarea id="notesArea" style="width:100%;height:300px;background:#111;color:white;border:none;border-radius:15px;padding:20px;"></textarea>

</div>

</section>


<!-- MISIONES -->

<section class="section" id="missions">

<div class="counterBox">

<h1 style="text-align:center;color:#ffd000;">MISIONES</h1>

<ul id="missionList" style="margin-top:20px;line-height:2;">
<li>Patrullar Gotham</li>
<li>Interrogar al Joker</li>
<li>Activar Batseñal</li>
</ul>

</div>

</section>

<!-- STATS -->

<section class="section" id="stats">

<div class="counterBox">

<h1 style="text-align:center;color:#ffd000;">ESTADÍSTICAS</h1>

<p id="statsText" style="margin-top:20px;"></p>

</div>

</section>


<!-- REEMPLAZA LOS AUDIOS POR ESTOS -->

<audio id="addSound">
<source src="sounds/add.mp3" type="audio/mpeg">
</audio>

<audio id="voteSound">
<source src="sounds/vote.mp3" type="audio/mpeg">
</audio>

<script>

/* EFECTOS */

for(let i=0;i<100;i++){

const drop=document.createElement("div");
drop.classList.add("drop");

drop.style.left=Math.random()*100+"vw";
drop.style.animationDuration=Math.random()*1+0.5+"s";
drop.style.animationDelay=Math.random()*2+"s";

document.getElementById("rain").appendChild(drop);

}

for(let i=0;i<40;i++){

const p=document.createElement("span");

p.style.left=Math.random()*100+"vw";
p.style.animationDuration=Math.random()*10+8+"s";
p.style.opacity=Math.random();

document.getElementById("particles").appendChild(p);

}

/* FRASES */

const quotes=[
"Why do we fall?",
"It's not who I am underneath.",
"The night is darkest before the dawn.",
"A hero can be anyone.",
"You either die a hero.",
"Fear is a tool.",
"Gotham needs me."
];

/* CONTADOR */

let count=localStorage.getItem("count") || 0;

document.getElementById("count").innerText=count;

function updateQuote(){

document.getElementById("quote").innerText=
quotes[Math.floor(Math.random()*quotes.length)];

}

updateQuote();

function change(num){

count=parseInt(count)+num;

saveCounter();

}

function customAdd(){

let n=parseInt(document.getElementById("customNum").value);

if(!isNaN(n)){

count=parseInt(count)+n;
saveCounter();

}

}

function customSub(){

let n=parseInt(document.getElementById("customNum").value);

if(!isNaN(n)){

count=parseInt(count)-n;
saveCounter();

}

}

function saveCounter(){

document.getElementById("count").innerText=count;

localStorage.setItem("count",count);

updateQuote();

document.getElementById("addSound").play();

updateStats();

}

/* SECCIONES */

function openSection(id){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active");
});

document.getElementById("hub").style.display="none";

document.getElementById(id).classList.add("active");

}

function showHub(){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active");
});

document.getElementById("hub").style.display="grid";

}




/* VOTACIONES */

let votes=JSON.parse(localStorage.getItem("votes")) || [];

function renderVotes(){

const grid=document.getElementById("voteGrid");

grid.innerHTML="";

votes.forEach((vote,index)=>{

const div=document.createElement("div");

div.className="voteCard";

div.innerHTML=`
<h3>${vote.title}</h3>
`;

div.onclick=()=>openVote(index);

grid.appendChild(div);

});

}

function createVote(){

const title=document.getElementById("voteTitle").value;
const op1=document.getElementById("option1").value;
const op2=document.getElementById("option2").value;

if(title && op1 && op2){

votes.push({
title,
options:[
{text:op1,votes:0},
{text:op2,votes:0}
],
voted:[]
});

saveVotes();

}

}

function openVote(index){

const modal=document.getElementById("voteModal");

modal.style.display="flex";

const vote=votes[index];

document.getElementById("modalTitle").innerText=vote.title;

const box=document.getElementById("modalOptions");

box.innerHTML="";

vote.options.forEach((o,i)=>{

const div=document.createElement("div");

div.className="option";

div.innerHTML=`
<span>${o.text} (${o.votes})</span>
<button onclick="voteOption(${index},${i})">Votar</button>
`;

box.appendChild(div);

});

box.innerHTML+=`
<button onclick="deleteVote(${index})">
Borrar votación
</button>
`;

}

function closeModal(){

document.getElementById("voteModal").style.display="none";

}

function voteOption(voteIndex,optIndex){

const key="vote_"+voteIndex+"_"+optIndex;

if(localStorage.getItem(key)) return;

votes[voteIndex].options[optIndex].votes++;

localStorage.setItem(key,true);

saveVotes();

openVote(voteIndex);

document.getElementById("voteSound").play();

}

function deleteVote(index){

votes.splice(index,1);

saveVotes();

closeModal();

}

function saveVotes(){

localStorage.setItem("votes",JSON.stringify(votes));

renderVotes();

updateStats();

}

renderVotes();

/* NOTAS */

const notes=document.getElementById("notesArea");

notes.value=localStorage.getItem("notes") || "";

notes.addEventListener("input",()=>{

localStorage.setItem("notes",notes.value);

});


/* STATS */

function updateStats(){

let totalVotes=0;

votes.forEach(v=>{
v.options.forEach(o=>{
totalVotes+=o.votes;
});
});

document.getElementById("statsText").innerHTML=`
Contador actual: ${count}<br><br>
Votaciones creadas: ${votes.length}<br><br>
Votos totales: ${totalVotes}
`;

}

updateStats();

/* EASTER EGG */

document.addEventListener("keydown",(e)=>{

if(e.key==="j"){

document.body.style.filter="hue-rotate(180deg)";

alert("Chaos Mode Activated");

}

});

</script>

</body>
</html>
