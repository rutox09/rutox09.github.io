<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BatmanHub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron',sans-serif;
    background:
    radial-gradient(circle at top,#1a1a1a 0%,#050505 60%);
    color:white;
    overflow-x:hidden;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:50px 50px;
    pointer-events:none;
}

header{
    width:100%;
    padding:40px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:50px;
    font-weight:800;
    letter-spacing:5px;
    color:#f5c542;
    text-shadow:0 0 20px rgba(245,197,66,0.4);
}

.bruce{
    color:#777;
    font-size:14px;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
    padding:60px;
    flex-wrap:wrap;
}

.app-card{
    width:340px;
    height:240px;
    background:linear-gradient(145deg,#111,#1f1f1f);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:0.4s;
    box-shadow:
    0 10px 30px rgba(0,0,0,0.7),
    inset 0 0 30px rgba(255,255,255,0.03);
}

.app-card:hover{
    transform:translateY(-10px) scale(1.02);
    border-color:#f5c542;
    box-shadow:
    0 0 30px rgba(245,197,66,0.3),
    0 20px 50px rgba(0,0,0,0.9);
}

.app-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,
    transparent,
    rgba(245,197,66,0.12),
    transparent);
    transform:translateX(-100%);
    transition:1s;
}

.app-card:hover::before{
    transform:translateX(100%);
}

.card-content{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.card-icon{
    font-size:70px;
}

.card-title{
    font-size:30px;
    letter-spacing:2px;
}

.section{
    display:none;
    padding:50px;
    animation:fade 0.4s ease;
}

.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.back-btn{
    margin-bottom:30px;
    padding:12px 24px;
    background:#111;
    color:#f5c542;
    border:1px solid #f5c542;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-family:'Orbitron';
}

.back-btn:hover{
    background:#f5c542;
    color:black;
}

.panel{
    max-width:900px;
    margin:auto;
    background:rgba(20,20,20,0.95);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;
    padding:50px;
    box-shadow:0 0 40px rgba(0,0,0,0.8);
}

.counter-number{
    font-size:120px;
    text-align:center;
    margin:30px 0;
    color:#f5c542;
    transition:0.2s;
    text-shadow:0 0 25px rgba(245,197,66,0.4);
}

.counter-controls{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    padding:14px 22px;
    border:none;
    border-radius:14px;
    background:#1f1f1f;
    color:white;
    cursor:pointer;
    transition:0.25s;
    font-family:'Orbitron';
}

button:hover{
    background:#f5c542;
    color:black;
    transform:scale(1.05);
}

input,textarea{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#101010;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    color:white;
    font-family:'Orbitron';
}

.quote{
    margin-top:35px;
    text-align:center;
    color:#999;
    min-height:40px;
    font-size:15px;
    transition:0.3s;
}

.vote-card{
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    background:#111;
    border:1px solid rgba(255,255,255,0.08);
}

.vote-option{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
    background:#1a1a1a;
    padding:12px;
    border-radius:12px;
}

.vote-bar{
    height:10px;
    background:#f5c542;
    border-radius:10px;
    margin-top:6px;
}

h2{
    margin-bottom:20px;
    color:#f5c542;
}

@media(max-width:800px){

.main{
    padding:30px;
}

.logo{
    font-size:35px;
}

.counter-number{
    font-size:80px;
}

.panel{
    padding:30px;
}

}
</style>
</head>

<body>

<header>
    <div class="logo">BATMANHUB</div>
    <div class="bruce">WAYNE ENTERPRISES</div>
</header>

<div id="hub" class="main">

    <div class="app-card" onclick="openSection('contador')">
        <div class="card-content">
            <div class="card-icon">🦇</div>
            <div class="card-title">CONTADOR</div>
        </div>
    </div>

    <div class="app-card" onclick="openSection('votaciones')">
        <div class="card-content">
            <div class="card-icon">⚖️</div>
            <div class="card-title">VOTACIONES</div>
        </div>
    </div>

</div>

<div id="contador" class="section">

    <button class="back-btn" onclick="goBack()">← HUB</button>

    <div class="panel">

        <h2>CONTADOR</h2>

        <div class="counter-number" id="contadorNumero">0</div>

        <div class="counter-controls">
            <button onclick="cambiar(-1)">-1</button>
            <button onclick="cambiar(1)">+1</button>

            <input type="number" id="cantidad" value="5" style="width:120px">

            <button onclick="sumarCantidad()">SUMAR</button>

            <button onclick="reiniciar()">REINICIAR</button>
        </div>

        <div class="quote" id="frase"></div>

    </div>

</div>

<div id="votaciones" class="section">

    <button class="back-btn" onclick="goBack()">← HUB</button>

    <div class="panel">

        <h2>CREAR VOTACIÓN</h2>

        <input id="titulo" placeholder="Título">

        <textarea id="opciones" rows="5" placeholder="Una opción por línea"></textarea>

        <button style="margin-top:20px" onclick="crearVotacion()">CREAR</button>

        <div id="listaVotaciones"></div>

    </div>

</div>

<script>

let contador = localStorage.getItem("contador")
? parseInt(localStorage.getItem("contador"))
: 0

const quotes = [

"Why do we fall?",
"The night is darkest before the dawn.",
"You either die a hero...",
"Gotham needs something more.",
"It's not who I am underneath.",
"A hero can be anyone.",
"Fear is a tool.",
"Welcome to a world without rules.",
"The Batman has no limits.",
"You have my permission to die.",
"Sometimes people deserve hope.",
"The fire rises.",
"Legends never die.",
"Criminals thrive on fear.",
"The city deserves a better class of criminal."

]

const audio = new Audio("https://actions.google.com/sounds/v1/impacts/metal_thin_hit.ogg")

const numero = document.getElementById("contadorNumero")

function actualizarContador(){

    numero.innerText = contador

    numero.style.transform = "scale(1.2)"

    setTimeout(()=>{
        numero.style.transform = "scale(1)"
    },150)

    localStorage.setItem("contador",contador)

    document.getElementById("frase").innerText =
    quotes[Math.floor(Math.random()*quotes.length)]

}

function cambiar(valor){

    contador += valor

    actualizarContador()

    audio.currentTime = 0
    audio.play()

}

function sumarCantidad(){

    let cantidad =
    parseInt(document.getElementById("cantidad").value)

    if(!isNaN(cantidad)){

        contador += cantidad

        actualizarContador()

        audio.currentTime = 0
        audio.play()

    }

}

function reiniciar(){

    contador = 0

    actualizarContador()

}

actualizarContador()

function openSection(id){

    document.getElementById("hub").style.display = "none"

    document.querySelectorAll(".section").forEach(sec=>{
        sec.classList.remove("active")
    })

    document.getElementById(id).classList.add("active")

}

function goBack(){

    document.getElementById("hub").style.display = "flex"

    document.querySelectorAll(".section").forEach(sec=>{
        sec.classList.remove("active")
    })

}

let votaciones = localStorage.getItem("votaciones")
? JSON.parse(localStorage.getItem("votaciones"))
: []

function guardarVotaciones(){

    localStorage.setItem(
        "votaciones",
        JSON.stringify(votaciones)
    )

}

function crearVotacion(){

    const titulo =
    document.getElementById("titulo").value

    const opciones =
    document.getElementById("opciones")
    .value
    .split("\n")
    .filter(o=>o.trim()!="")

    if(titulo && opciones.length > 0){

        votaciones.push({
            titulo,
            opciones: opciones.map(o=>({
                nombre:o,
                votos:0
            }))
        })

        guardarVotaciones()

        renderVotaciones()

        document.getElementById("titulo").value=""
        document.getElementById("opciones").value=""

    }

}

function votar(votacionIndex,opcionIndex){

    votaciones[votacionIndex]
    .opciones[opcionIndex]
    .votos++

    guardarVotaciones()

    renderVotaciones()

}

function renderVotaciones(){

    const contenedor =
    document.getElementById("listaVotaciones")

    contenedor.innerHTML=""

    votaciones.forEach((v,index)=>{

        let total =
        v.opciones.reduce((acc,o)=>acc+o.votos,0)

        let html = `
        <div class="vote-card">

            <h2>${v.titulo}</h2>
        `

        v.opciones.forEach((o,i)=>{

            let porcentaje =
            total > 0
            ? (o.votos/total)*100
            : 0

            html += `
            <div class="vote-option">

                <div style="width:100%">

                    <div>
                    ${o.nombre}
                    (${o.votos})
                    </div>

                    <div class="vote-bar"
                    style="width:${porcentaje}%"></div>

                </div>

                <button onclick="votar(${index},${i})">
                VOTAR
                </button>

            </div>
            `

        })

        html += `</div>`

        contenedor.innerHTML += html

    })

}

renderVotaciones()

</script>

</body>
</html>
